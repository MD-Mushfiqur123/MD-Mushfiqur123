name: Generate Contribution Animations (Snake, Matrix & Biome)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contrib-animations.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: MD-Mushfiqur123
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light

      - name: Generate Matrix Contribution Graph
        uses: N1k0droid/matrix-svg-contrib@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: MD-Mushfiqur123

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Real 30-Day Cyber Cyan Contribution Pulse Graph
        run: |
          python scripts/generate_contribution_graph.py
          mkdir -p dist
          cp assets/contribution-pulse-graph.svg dist/contribution-pulse-graph.svg || true

      - name: Fetch Minecraft Sakura Contribution Biome
        run: |
          mkdir -p dist
          curl -s -L "https://gh-tree.vercel.app/api/tree?user=MD-Mushfiqur123&theme=sakura" -o dist/minecraft-sakura-tree.gif || true

      - name: Deploy All Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
