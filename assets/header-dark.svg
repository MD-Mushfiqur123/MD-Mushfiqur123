<svg width="1000" height="180" viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave-1-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="wave-2-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25" />
    </linearGradient>

    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes float-w1 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0px); }
      }
      @keyframes float-w2 {
        0% { transform: translateX(0px); }
        50% { transform: translateX(30px); }
        100% { transform: translateX(0px); }
      }
      @keyframes pulse-star {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.8; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #38bdf8;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: 'JetBrains Mono', 'Segoe UI', monospace;
        font-weight: 600;
        font-size: 15px;
        fill: #a855f7;
        letter-spacing: 0.3px;
      }
      .star { fill: #38bdf8; animation: pulse-star 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Cyber Twinkling Ambient Stars -->
  <circle cx="120" cy="30" r="2" class="star" style="animation-delay: 0.2s;" />
  <circle cx="280" cy="50" r="1.5" class="star" style="animation-delay: 1.1s;" />
  <circle cx="450" cy="20" r="2" class="star" style="animation-delay: 0.7s;" />
  <circle cx="720" cy="35" r="1.5" class="star" style="animation-delay: 1.8s;" />
  <circle cx="880" cy="25" r="2" class="star" style="animation-delay: 2.3s;" />
  <circle cx="920" cy="60" r="1" class="star" style="animation-delay: 0.5s;" />

  <!-- Flowing Fluid Waves (Layer 1) -->
  <g style="animation: float-w1 8s ease-in-out infinite;">
    <path d="M 0 135 C 250 110 450 160 700 125 C 850 105 950 130 1050 120 L 1050 180 L 0 180 Z" fill="url(#wave-1-dark)" />
  </g>

  <!-- Flowing Fluid Waves (Layer 2) -->
  <g style="animation: float-w2 6s ease-in-out infinite;">
    <path d="M -50 145 C 200 170 400 120 650 150 C 800 165 920 135 1050 145 L 1050 180 L -50 180 Z" fill="url(#wave-2-dark)" />
  </g>

  <!-- Typography -->
  <g transform="translate(500, 68)">
    <text x="0" y="0" text-anchor="middle" class="title-text" filter="url(#glow-dark)">Md Mushfiqur Rahim</text>
    <text x="0" y="36" text-anchor="middle" class="sub-text">AI &amp; Systems Researcher • Open Source Contributor • Bangladesh 🇧🇩</text>
  </g>
</svg>