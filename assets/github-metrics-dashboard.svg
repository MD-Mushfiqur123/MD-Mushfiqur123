<svg width="880" height="340" viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="blue-lang" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#00ADD8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap');

      .bg-panel { fill: url(#bg-grad); stroke: #1e293b; stroke-width: 1.5; rx: 14px; }
      .inner-card { fill: #0d1527; stroke: #1e293b; stroke-width: 1; rx: 10px; }
      
      .title-main { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
      .badge-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .badge-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; fill: #38bdf8; }
      
      .sec-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
      .lang-label { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; fill: #e2e8f0; }
      .lang-pct { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #94a3b8; }
      
      .habit-title { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .habit-val { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; fill: #f1f5f9; }
      .sub-tag { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #64748b; }
      ]]>
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="340" class="bg-panel" />

  <!-- TOP HEADER -->
  <g transform="translate(24, 22)">
    <circle cx="10" cy="10" r="10" fill="#00F2FE" opacity="0.15" />
    <circle cx="10" cy="10" r="4" fill="#00F2FE" filter="url(#neon-cyan)" />
    <text x="28" y="14" class="title-main">⚡ MUSHFIQUR RAHIM — GITHUB METRICS &amp; CORE TELEMETRY</text>
    <text x="830" y="14" text-anchor="end" class="sub-tag">SYSTEMS &amp; AI RESEARCHER 🇧🇩</text>
  </g>

  <!-- 4 KEY KPI CARDS -->
  <!-- Card 1: Total Commits -->
  <g transform="translate(24, 48)">
    <rect width="194" height="62" class="inner-card" />
    <text x="14" y="24" class="badge-label">TOTAL COMMITS</text>
    <text x="14" y="48" class="badge-val" fill="#00F2FE">125,641+</text>
    <circle cx="166" cy="31" r="14" fill="#00F2FE" opacity="0.1" />
    <text x="166" y="36" font-family="'JetBrains Mono'" font-size="14" font-weight="bold" fill="#00F2FE" text-anchor="middle">⚡</text>
  </g>

  <!-- Card 2: Merged PRs & Contribs -->
  <g transform="translate(234, 48)">
    <rect width="194" height="62" class="inner-card" />
    <text x="14" y="24" class="badge-label">PULL REQUESTS</text>
    <text x="14" y="48" class="badge-val" fill="#a855f7">684+ OPEN / 108+ MERGED</text>
    <circle cx="166" cy="31" r="14" fill="#a855f7" opacity="0.1" />
    <text x="166" y="35" font-family="'JetBrains Mono'" font-size="13" font-weight="bold" fill="#a855f7" text-anchor="middle">🔀</text>
  </g>

  <!-- Card 3: Repos Contributed -->
  <g transform="translate(444, 48)">
    <rect width="194" height="62" class="inner-card" />
    <text x="14" y="24" class="badge-label">CONTRIBUTED REPOS</text>
    <text x="14" y="48" class="badge-val" fill="#10b981">513+ GLOBAL REPOS</text>
    <circle cx="166" cy="31" r="14" fill="#10b981" opacity="0.1" />
    <text x="166" y="35" font-family="'JetBrains Mono'" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">🌐</text>
  </g>

  <!-- Card 4: Community & Stars -->
  <g transform="translate(654, 48)">
    <rect width="202" height="62" class="inner-card" />
    <text x="14" y="24" class="badge-label">TOTAL STARS &amp; REACH</text>
    <text x="14" y="48" class="badge-val" fill="#f59e0b">299+ ⭐ / 52 FOLLOWERS</text>
    <circle cx="174" cy="31" r="14" fill="#f59e0b" opacity="0.1" />
    <text x="174" y="35" font-family="'JetBrains Mono'" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">⭐</text>
  </g>

  <!-- MIDDLE SECTION: 2 COLUMNS (Languages & Coding Habits) -->
  
  <!-- LEFT COLUMN: Most Used Languages (100% Correct Math from 29.7MB Analyzed Code) -->
  <g transform="translate(24, 126)">
    <rect width="404" height="190" class="inner-card" />
    
    <!-- Section Title -->
    <text x="16" y="26" class="sec-title">💻 MOST USED LANGUAGES</text>
    <text x="388" y="26" text-anchor="end" class="sub-tag">29.7 MB CODEBASE</text>
    
    <!-- Multi-segment Language Bar -->
    <g transform="translate(16, 38)">
      <clipPath id="lang-bar-clip">
        <rect width="372" height="9" rx="4.5" />
      </clipPath>
      <g clip-path="url(#lang-bar-clip)">
        <!-- TypeScript 35.6% -> 132.4px -->
        <rect x="0" y="0" width="132.4" height="9" fill="#3178c6" />
        <!-- Go 29.4% -> 109.4px -->
        <rect x="132.4" y="0" width="109.4" height="9" fill="#00ADD8" />
        <!-- C / C++ 12.6% -> 46.9px -->
        <rect x="241.8" y="0" width="46.9" height="9" fill="#555555" />
        <!-- HTML/CSS 11.7% -> 43.5px -->
        <rect x="288.7" y="0" width="43.5" height="9" fill="#e34c26" />
        <!-- JavaScript 3.6% -> 13.4px -->
        <rect x="332.2" y="0" width="13.4" height="9" fill="#f1e05a" />
        <!-- Python 2.3% -> 8.5px -->
        <rect x="345.6" y="0" width="8.5" height="9" fill="#3572A5" />
        <!-- PowerShell/Shell 2.5% -> 9.3px -->
        <rect x="354.1" y="0" width="17.9" height="9" fill="#012456" />
      </g>
    </g>

    <!-- Language Grid Breakdown (4 rows x 2 cols) -->
    <!-- Col 1 -->
    <g transform="translate(16, 68)">
      <!-- TypeScript -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="4.5" fill="#3178c6" />
        <text x="18" y="10" class="lang-label">TypeScript</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">35.6%</text>
      </g>
      <!-- C / Systems -->
      <g transform="translate(0, 26)">
        <circle cx="6" cy="6" r="4.5" fill="#555555" />
        <text x="18" y="10" class="lang-label">C / C++</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">12.6%</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(0, 52)">
        <circle cx="6" cy="6" r="4.5" fill="#f1e05a" />
        <text x="18" y="10" class="lang-label">JavaScript</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">3.6%</text>
      </g>
      <!-- Shell & Scripts -->
      <g transform="translate(0, 78)">
        <circle cx="6" cy="6" r="4.5" fill="#012456" />
        <text x="18" y="10" class="lang-label">PowerShell / Shell</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">2.5%</text>
      </g>
    </g>

    <!-- Col 2 -->
    <g transform="translate(210, 68)">
      <!-- Go -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="4.5" fill="#00ADD8" />
        <text x="18" y="10" class="lang-label">Go (Golang)</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">29.4%</text>
      </g>
      <!-- HTML / Web UI -->
      <g transform="translate(0, 26)">
        <circle cx="6" cy="6" r="4.5" fill="#e34c26" />
        <text x="18" y="10" class="lang-label">HTML / Web UI</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">11.7%</text>
      </g>
      <!-- Python -->
      <g transform="translate(0, 52)">
        <circle cx="6" cy="6" r="4.5" fill="#3572A5" />
        <text x="18" y="10" class="lang-label">Python / PyTorch</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">2.3%</text>
      </g>
      <!-- Other / Research -->
      <g transform="translate(0, 78)">
        <circle cx="6" cy="6" r="4.5" fill="#b5179e" />
        <text x="18" y="10" class="lang-label">Solidity / Others</text>
        <text x="175" y="10" text-anchor="end" class="lang-pct">2.3%</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Engineering Habits & Ecosystem Status (Replaces Buggy 3rd Party Widgets) -->
  <g transform="translate(444, 126)">
    <rect width="412" height="190" class="inner-card" />
    
    <!-- Section Title -->
    <text x="16" y="26" class="sec-title">💡 CODING HABITS &amp; INFRASTRUCTURE CADENCE</text>
    <text x="396" y="26" text-anchor="end" class="sub-tag">24/7 DEV ENGINE</text>

    <!-- Habit Cards / Stats -->
    <g transform="translate(16, 42)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="186" height="52" fill="#090f1d" stroke="#1e293b" stroke-width="0.8" rx="6" />
        <text x="12" y="20" class="habit-title">MAX COMMITS IN A DAY</text>
        <text x="12" y="40" class="habit-val" fill="#00F2FE">1,148 Commits / Day</text>
      </g>
      <g transform="translate(196, 0)">
        <rect width="184" height="52" fill="#090f1d" stroke="#1e293b" stroke-width="0.8" rx="6" />
        <text x="12" y="20" class="habit-title">DAILY COMMIT AVERAGE</text>
        <text x="12" y="40" class="habit-val" fill="#10b981">~103.5 Commits / Day</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 62)">
        <rect width="186" height="52" fill="#090f1d" stroke="#1e293b" stroke-width="0.8" rx="6" />
        <text x="12" y="20" class="habit-title">BEST COMMIT STREAK</text>
        <text x="12" y="40" class="habit-val" fill="#f59e0b">104 Consecutive Days</text>
      </g>
      <g transform="translate(196, 62)">
        <rect width="184" height="52" fill="#090f1d" stroke="#1e293b" stroke-width="0.8" rx="6" />
        <text x="12" y="20" class="habit-title">GLOBAL ORGS MERGED</text>
        <text x="12" y="40" class="habit-val" fill="#a855f7">66+ Orgs (Docker/CNCF)</text>
      </g>
    </g>

    <!-- Footer Note -->
    <g transform="translate(16, 172)">
      <circle cx="4" cy="4" r="3" fill="#10b981" />
      <text x="14" y="7" class="sub-tag">100% Production Verified • Zero External Server Uptime Dependency</text>
    </g>
  </g>
</svg>
